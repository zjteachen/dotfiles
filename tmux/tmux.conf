
# ~/.tmux.conf — A better starting point for tmux

# Change prefix from Ctrl+b to Ctrl+a
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Improve base index (start windows at 1)
set-option -g base-index 1
set-option -g pane-base-index 1

# Reload config file (unbinds previous C-b r)
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Enable mouse mode (resize, switch, scroll)
set-option -g mouse on

# Set better window and pane splitting shortcuts
bind | split-window -h    # Split horizontally with |
bind - split-window -v    # Split vertically with -

# Use vim-like keys in copy mode
setw -g mode-keys vi
set -g renumber-windows on

# Set status bar (modern look)
set-option -g status-interval 1
set-option -g status-left "#[fg=green]#S #[fg=yellow]#I:#P "
set-option -g status-right "#[fg=cyan]%Y-%m-%d %H:%M#[default]"

# Window list in status bar
set-option -g window-status-format "#I:#W"
set-option -g window-status-current-format "#[bold]#I:#W"

# Faster key repetition
set-option -s escape-time 0

# Clipboard integration via OSC 52 (works over SSH; no xclip/pbcopy needed).
#
# `on` lets tmux both store yanks and forward them out to the host terminal,
# and makes any OSC 52 *read* be answered from tmux's own buffer rather than
# queried from the Mac terminal (so it can never trigger the macOS prompt).
set-option -g set-clipboard on
#
# Force-forward the OSC 52 clipboard write to the host terminal regardless of
# its TERM name. Without this tmux only forwards for terminals it already knows
# support clipboard (xterm*), silently dropping writes from e.g. wezterm/alacritty.
set-option -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Resize panes with Ctrl+arrow keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind E setw synchronize-panes

# Quick pane cycling
bind-key tab next-window
bind-key S-tab last-window

# Keep the `prefix + q` pane-number overlay up until a key is pressed.
# tmux dismisses display-panes on the first keypress (a digit selects that
# pane, Esc/any other key cancels); this just removes the auto-timeout by
# setting the display time to ~1 hour instead of the default 1000ms.
set-option -g display-panes-time 3600000

# Enable terminal colors
set-option -g default-terminal "screen-256color"
set -g history-limit 50000

# ---------------------------------------------------------------------------
# Plugins (managed by TPM — https://github.com/tmux-plugins/tpm)
#   Install/update:  prefix + I   (capital i)
#   Update:          prefix + U
#   Remove unlisted: prefix + alt + u
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save resurrect + restore on start

# tmux-resurrect: save with `prefix + Ctrl-s`, restore with `prefix + Ctrl-r`.
#
# Restore these programs when their pane is reopened. NOTE: setting this
# overrides resurrect's built-in default list, so nvim is listed explicitly
# alongside claude (both are the "trusted" processes we allow relaunching).
set -g @resurrect-processes 'claude nvim vim'
#
# Restore the actual nvim editing session (open buffers), not just a blank
# editor. Requires a Session.vim in the pane's cwd — install tpope/vim-obsession
# in nvim so one is written automatically.
set -g @resurrect-strategy-nvim 'session'
#
# Also restore pane contents (scrollback) on top of the layout.
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: automate resurrect. Saves every 15 min and, with restore
# enabled, brings the last saved environment back automatically when the tmux
# server starts — no manual prefix + Ctrl-s / Ctrl-r needed.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM — keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
